[tool.black]
line-length = 100
target-version = ['py313']
include = '(app\.py|src/(dashboard_data|workbench_data|event_workbench|spatial_workbench|forecast_lab|forecast_benchmarks|bundle_data|open_policy|open_results|open_events|warehouse|build_site|build_docs|data_quality|club_identity|result_corrections)\.py|tests/.*\.py|scripts/.*\.py)$'
extend-exclude = '/(site|node_modules|\.venv|\.artifacts)/'
