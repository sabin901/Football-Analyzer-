<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Football Analyzer</title>
<style>
  :root{
    --bg:#0a0d12; --bg2:#0d1119; --panel:rgba(22,28,38,.72); --panel-solid:#141a24;
    --panel2:#1a212c; --raise:#202834; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
    --fg:#f0f4f9; --mut:#9aa7b8; --mut2:#67727f;
    --accent:#4ea1ff; --accent2:#46d19e; --grad:linear-gradient(120deg,#46d19e,#4ea1ff);
    --gold:#ffd34e; --green:#46d19e; --red:#ff6b6b; --violet:#a78bfa;
    --r:16px; --r-sm:11px;
    --sh:0 2px 8px rgba(0,0,0,.35), 0 20px 50px -20px rgba(0,0,0,.6);
    --glow:0 0 0 1px rgba(78,161,255,.2), 0 8px 30px -8px rgba(78,161,255,.35);
    --fs:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#f4f6fa; --bg2:#eef1f6; --panel:rgba(255,255,255,.82); --panel-solid:#ffffff;
    --panel2:#f3f5f9; --raise:#eaeef4; --line:rgba(15,25,40,.09); --line2:rgba(15,25,40,.16);
    --fg:#121820; --mut:#5a6778; --mut2:#8a95a3;
    --sh:0 2px 8px rgba(30,45,70,.08), 0 20px 50px -24px rgba(30,45,70,.18);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--fs);
    -webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden;
    background-image:
      radial-gradient(900px 440px at 88% -8%, rgba(78,161,255,.10), transparent 62%),
      radial-gradient(760px 420px at 6% 2%, rgba(70,209,158,.08), transparent 58%);}
  .num{font-variant-numeric:tabular-nums}
  a{color:var(--accent);text-decoration:none}
  ::selection{background:rgba(78,161,255,.3)}

  /* top bar */
  .topbar{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px) saturate(140%);
    background:color-mix(in srgb, var(--bg) 78%, transparent);border-bottom:1px solid var(--line)}
  .topbar-in{max-width:1180px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
  .brand .logo{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--grad);
    font-size:17px;box-shadow:0 4px 14px -4px rgba(78,161,255,.6)}
  .brand .ac{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .nav{display:flex;gap:3px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .tab{appearance:none;border:1px solid transparent;background:transparent;color:var(--mut);cursor:pointer;
    font-size:13px;font-weight:650;padding:8px 13px;border-radius:999px;font-family:inherit;
    transition:.18s cubic-bezier(.4,0,.2,1);white-space:nowrap}
  .tab:hover{color:var(--fg);background:var(--panel2)}
  .tab.active{color:#06101f;background:var(--grad);box-shadow:0 3px 14px -3px rgba(78,161,255,.5)}
  .tbtn{appearance:none;border:1px solid var(--line2);background:var(--panel2);color:var(--mut);
    width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:15px;display:grid;place-items:center;
    margin-left:8px;transition:.15s}
  .tbtn:hover{color:var(--fg);border-color:var(--accent)}

  main{max-width:1180px;margin:0 auto;padding:26px 22px 90px}
  .view{animation:rise .42s cubic-bezier(.2,.7,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .hero{margin:4px 0 22px}
  .hero h1{font-size:28px;margin:0 0 7px;letter-spacing:-.025em;font-weight:820;line-height:1.1}
  .hero p{margin:0;color:var(--mut);font-size:15px;max-width:740px}
  .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;color:var(--accent2);margin-bottom:12px}
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2)}

  .card{background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--r);
    padding:22px;margin-bottom:18px;box-shadow:var(--sh);transition:border-color .2s,transform .2s}
  .card h2{margin:0 0 3px;font-size:17px;font-weight:750;letter-spacing:-.01em}
  .card h3{margin:0 0 12px;font-size:14px;font-weight:700;color:var(--fg)}
  .card .sub{margin:0 0 18px;color:var(--mut);font-size:13px;max-width:780px}
  .hint{font-size:12.5px;color:var(--mut2);margin-top:12px}

  .controls{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:7px;min-width:180px;flex:1}
  .field label{font-size:11px;color:var(--mut2);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  select{font-size:14px;padding:11px 12px;border-radius:var(--r-sm);background:var(--panel2);color:var(--fg);
    border:1px solid var(--line2);font-family:inherit;transition:.15s;cursor:pointer;width:100%}
  select:hover{border-color:var(--mut2)}
  select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(78,161,255,.16)}
  button.go{background:var(--grad);color:#06101f;border:none;font-weight:750;font-size:14px;cursor:pointer;
    padding:12px 22px;border-radius:var(--r-sm);font-family:inherit;transition:.16s;box-shadow:0 4px 14px -5px rgba(78,161,255,.6)}
  button.go:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06)}
  button.go:active:not(:disabled){transform:translateY(0)}
  button.go:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

  .report-img{width:100%;border-radius:var(--r-sm);border:1px solid var(--line);margin-top:6px;background:var(--panel2)}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:16px;transition:.18s;position:relative;overflow:hidden}
  .stat:hover{border-color:var(--line2);transform:translateY(-2px)}
  .stat .v{font-size:24px;font-weight:800;letter-spacing:-.02em}
  .stat .l{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.35}
  .v.accent{color:var(--accent)} .v.gold{color:var(--gold)} .v.green{color:var(--green)} .v.red{color:var(--red)} .v.violet{color:var(--violet)}

  /* feature cards (overview) */
  .feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .fcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;
    transition:.2s;box-shadow:var(--sh)}
  .fcard:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--glow)}
  .fcard .ico{font-size:22px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
    background:var(--panel2);margin-bottom:12px}
  .fcard h4{margin:0 0 5px;font-size:15px;font-weight:720}
  .fcard p{margin:0;color:var(--mut);font-size:13px;line-height:1.5}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{text-align:left;color:var(--mut2);font-weight:650;padding:9px 10px;font-size:11px;
    text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line2)}
  tbody td{padding:10px;border-top:1px solid var(--line)}
  tbody tr{transition:background .12s}
  tbody tr.click{cursor:pointer}
  tbody tr.click:hover{background:var(--panel2)}
  td.a{color:var(--accent)} td.r{color:var(--red)} td.g{color:var(--green)} td.mut{color:var(--mut)}
  .pos{color:var(--mut2);font-variant-numeric:tabular-nums;width:26px}
  .teamcell{font-weight:650}

  .form{display:inline-flex;gap:3px}
  .fb{width:19px;height:19px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#07100a}
  .fb.W{background:var(--green)} .fb.D{background:#5b6775;color:#fff} .fb.L{background:var(--red)}

  .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:750;font-size:12px;font-variant-numeric:tabular-nums}
  .chip.pos{background:rgba(70,209,158,.16);color:var(--green)}
  .chip.neg{background:rgba(255,107,107,.16);color:var(--red)}
  .chip.zero{background:var(--raise);color:var(--mut)}

  .probbar{display:flex;height:38px;border-radius:11px;overflow:hidden;border:1px solid var(--line2);margin-top:4px}
  .probbar .seg{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#07101c;transition:width .5s cubic-bezier(.3,.8,.3,1)}
  .seg.h{background:var(--accent)} .seg.d{background:#5b6775;color:#fff} .seg.a{background:var(--red)}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:820px){.two{grid-template-columns:1fr}}
  .muted{color:var(--mut)}
  .tag{display:inline-block;font-size:11px;color:var(--mut2);font-weight:650;background:var(--panel2);
    border:1px solid var(--line);padding:3px 9px;border-radius:999px;margin-left:8px;vertical-align:middle}

  /* skeleton */
  .sk{background:linear-gradient(90deg,var(--panel2) 25%,var(--raise) 50%,var(--panel2) 75%);
    background-size:200% 100%;animation:shim 1.3s infinite;border-radius:8px}
  @keyframes shim{to{background-position:-200% 0}}
  .spinner{display:inline-block;width:18px;height:18px;border:2.5px solid var(--line2);
    border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:9px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading{color:var(--mut);font-size:14px;padding:30px 0;text-align:center}
  .err{color:var(--red);font-size:14px;padding:13px 16px;background:rgba(255,107,107,.08);
    border:1px solid rgba(255,107,107,.3);border-radius:var(--r-sm);margin-bottom:16px}
  footer{max-width:1180px;margin:0 auto;padding:12px 22px 54px;color:var(--mut2);font-size:12px;text-align:center}
</style>
</head>
<body>
<div id="root"></div>

<script type="importmap">
{ "imports":{ "preact":"/app/vendor/preact.mjs","preact/hooks":"/app/vendor/hooks.mjs","htm":"/app/vendor/htm.mjs" } }
</script>
<script type="module">
import { h, render } from "preact";
import { useState, useEffect, useRef } from "preact/hooks";
import htm from "htm";
const html = htm.bind(h);
const API = "";

async function get(url){ const r=await fetch(url); if(!r.ok){const t=await r.text();throw new Error(t||r.statusText);} return r.json(); }

/* animated count-up */
function useCountUp(target,dur=850){
  const [v,setV]=useState(0); const ref=useRef(0);
  useEffect(()=>{ let raf; const from=ref.current, start=performance.now();
    const tick=now=>{ const p=Math.min(1,(now-start)/dur); const e=1-Math.pow(1-p,3);
      const cur=from+(target-from)*e; ref.current=cur; setV(cur); if(p<1) raf=requestAnimationFrame(tick); };
    raf=requestAnimationFrame(tick); return ()=>cancelAnimationFrame(raf);
  },[target]); return v;
}
function Counter({value,dec=0,suffix="",prefix="",comma=false}){
  const v=useCountUp(value); let s=dec?v.toFixed(dec):Math.round(v).toString();
  if(comma) s=Math.round(v).toLocaleString();
  return html`<span class="num">${prefix}${s}${suffix}</span>`;
}
function Stat({value,label,cls}){ return html`<div class="stat"><div class="v num ${cls||''}">${value}</div><div class="l">${label}</div></div>`; }
function Form({form}){ return html`<span class="form">${(form||[]).map(f=>html`<span class="fb ${f}">${f}</span>`)}</span>`; }
function Loading({label}){ return html`<div class="loading"><span class="spinner"></span>${label||'Loading…'}</div>`; }
function Skeleton({h:ht=140}){ return html`<div class="card"><div class="sk" style="height:${ht}px"></div></div>`; }

/* ---- SVG charts ---- */
function Scatter({table,onPick}){
  const W=680,H=440,pad=48;
  const xs=table.map(t=>t.xpts),ys=table.map(t=>t.pts);
  const lo=Math.min(...xs,...ys)-3,hi=Math.max(...xs,...ys)+3;
  const sx=v=>pad+(v-lo)/(hi-lo)*(W-pad*1.4),sy=v=>H-pad-(v-lo)/(hi-lo)*(H-pad*1.6);
  const ticks=[];for(let v=Math.ceil(lo/10)*10;v<hi;v+=10)ticks.push(v);
  return html`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${ticks.map(v=>html`<g><line x1=${sx(v)} y1=${sy(lo)} x2=${sx(v)} y2=${sy(hi)} stroke="var(--line)"/>
      <line x1=${sx(lo)} y1=${sy(v)} x2=${sx(hi)} y2=${sy(v)} stroke="var(--line)"/>
      <text x=${sx(v)} y=${H-pad+16} fill="var(--mut2)" font-size="10" text-anchor="middle">${v}</text>
      <text x=${pad-10} y=${sy(v)+3} fill="var(--mut2)" font-size="10" text-anchor="end">${v}</text></g>`)}
    <line x1=${sx(lo)} y1=${sy(lo)} x2=${sx(hi)} y2=${sy(hi)} stroke="var(--mut2)" stroke-dasharray="5 5" opacity=".7"/>
    <text x=${W/2} y=${H-8} fill="var(--mut)" font-size="11" text-anchor="middle">Expected points (xPts)</text>
    <text x=14 y=${H/2} fill="var(--mut)" font-size="11" text-anchor="middle" transform="rotate(-90 14 ${H/2})">Actual points</text>
    ${table.map(t=>{const over=t.pts>=t.xpts;return html`<g style="cursor:pointer" onClick=${()=>onPick&&onPick(t.team)}>
      <title>${t.team}: ${t.pts} pts vs ${t.xpts} xPts</title>
      <circle cx=${sx(t.xpts)} cy=${sy(t.pts)} r="6" fill=${over?'var(--green)':'var(--red)'} fill-opacity=".9" stroke="var(--bg)" stroke-width="1.5"/>
      <text x=${sx(t.xpts)+9} y=${sy(t.pts)+3} fill="var(--fg)" font-size="9.5" opacity=".82">${t.team.length>12?t.team.slice(0,11)+'…':t.team}</text></g>`;})}
  </svg>`;
}
function PointsLine({log}){
  const W=680,H=300,pad=42,n=log.length;
  const maxP=Math.max(log[n-1].cum_pts,log[n-1].cum_xpts||0)+2;
  const sx=i=>pad+i/(n-1)*(W-pad*1.4),sy=v=>H-pad-v/maxP*(H-pad*1.5);
  const path=k=>log.map((l,i)=>`${i?'L':'M'}${sx(i).toFixed(1)} ${sy(l[k]).toFixed(1)}`).join(' ');
  const hasX=log[n-1].cum_xpts!=null;
  return html`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${[0,Math.round(maxP/2),Math.round(maxP)].map(v=>html`<g><line x1=${pad} y1=${sy(v)} x2=${W-pad*0.4} y2=${sy(v)} stroke="var(--line)"/>
      <text x=${pad-8} y=${sy(v)+3} fill="var(--mut2)" font-size="10" text-anchor="end">${v}</text></g>`)}
    ${hasX?html`<path d=${path('cum_xpts')} fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="4 4" opacity=".9"/>`:null}
    <path d=${path('cum_pts')} fill="none" stroke="var(--accent)" stroke-width="2.6"/>
    <text x=${W-pad} y=16 fill="var(--accent)" font-size="11" text-anchor="end">actual points</text>
    ${hasX?html`<text x=${W-pad} y=32 fill="var(--gold)" font-size="11" text-anchor="end">expected points</text>`:null}
    <text x=${W/2} y=${H-6} fill="var(--mut)" font-size="11" text-anchor="middle">Matchday →</text>
  </svg>`;
}
function Radar({axes,a,b,nameA,nameB}){
  const W=420,H=380,cx=W/2,cy=H/2+6,R=128,N=axes.length;
  const pt=(i,val)=>{const ang=-Math.PI/2+i*2*Math.PI/N;return [cx+Math.cos(ang)*R*val,cy+Math.sin(ang)*R*val];};
  const poly=vals=>vals.map((v,i)=>pt(i,v).join(',')).join(' ');
  const rings=[.25,.5,.75,1];
  return html`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:440px;height:auto;display:block;margin:0 auto">
    ${rings.map(r=>html`<polygon points=${axes.map((_,i)=>pt(i,r).join(',')).join(' ')} fill="none" stroke="var(--line)"/>`)}
    ${axes.map((ax,i)=>{const[x,y]=pt(i,1.12);return html`<g>
      <line x1=${cx} y1=${cy} x2=${pt(i,1)[0]} y2=${pt(i,1)[1]} stroke="var(--line)"/>
      <text x=${x} y=${y} fill="var(--mut)" font-size="10.5" text-anchor="middle" dominant-baseline="middle">${ax}</text></g>`;})}
    <polygon points=${poly(b)} fill="rgba(255,107,107,.16)" stroke="var(--red)" stroke-width="2"/>
    <polygon points=${poly(a)} fill="rgba(78,161,255,.18)" stroke="var(--accent)" stroke-width="2"/>
  </svg>
  <div style="display:flex;gap:18px;justify-content:center;margin-top:6px;font-size:12.5px">
    <span style="color:var(--accent);font-weight:700">● ${nameA}</span>
    <span style="color:var(--red);font-weight:700">● ${nameB}</span>
  </div>`;
}

/* ---------------- Overview ---------------- */
function Overview({go}){
  const [m,setM]=useState(null);const [n,setN]=useState(null);const [tbl,setTbl]=useState(null);
  useEffect(()=>{ get(`${API}/api/model`).then(setM).catch(()=>{});
    get(`${API}/api/predict/seasons`).then(s=>setN(s.length)).catch(()=>{});
    get(`${API}/api/table?competition=Premier%20League&season=2022/2023`).then(setTbl).catch(()=>{}); },[]);
  const over = tbl&&tbl.has_xpts? [...tbl.table].sort((a,b)=>b.xpts_diff-a.xpts_diff)[0]:null;
  const under = tbl&&tbl.has_xpts? [...tbl.table].sort((a,b)=>a.xpts_diff-b.xpts_diff)[0]:null;
  const feats=[
    ["table","📊","League table","Standings beside expected points — who's over- and under-performing."],
    ["compare","⚔️","Compare teams","Head-to-head radar across attack, defence, form and goals."],
    ["predict","🔮","Match predictor","Win/draw/loss, expected goals and scorelines for any fixture."],
    ["xt","🎯","Expected Threat","Value ball progression and rank the best creators."],
    ["match","⚽","Match report","Shot maps, xG race and pass networks from event data."],
    ["scout","🔍","Scouting","Full-season opponent profiles and tendencies."],
  ];
  return html`<div class="view">
    <div class="hero">
      <div class="eyebrow">Football intelligence</div>
      <h1>See the game beneath the scoreline.</h1>
      <p>An end-to-end analytics engine — expected goals, expected threat, team strength and match prediction — built from raw event data across the five major European leagues and 23 seasons.</p>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="v accent">${m?html`<${Counter} value=${m.roc_auc} dec=${3}/>`:'—'}</div><div class="l">xG model ROC-AUC</div></div>
      <div class="stat"><div class="v">${m?html`<${Counter} value=${m.n_shots} comma=${true}/>`:'—'}</div><div class="l">shots trained on</div></div>
      <div class="stat"><div class="v gold">${n?html`<${Counter} value=${n}/>`:'—'}</div><div class="l">league-seasons</div></div>
      <div class="stat"><div class="v green">${html`<${Counter} value=${54.9} dec=${1} suffix="%"/>`}</div><div class="l">predictor accuracy (PL 22/23)</div></div>
    </div>
    ${over&&under&&html`<div class="two">
      <div class="card"><h3>Biggest over-performer · PL 2022/23</h3>
        <div style="display:flex;align-items:center;gap:14px">
          <div style="font-size:30px;font-weight:820">${over.team}</div>
          <span class="chip pos">+${over.xpts_diff} vs xPts</span></div>
        <p class="sub" style="margin-top:10px">Took ${over.pts} points from fixtures the model valued at ${over.xpts} — squeezing more from their chances than the underlying play suggested.</p></div>
      <div class="card"><h3>Biggest under-performer · PL 2022/23</h3>
        <div style="display:flex;align-items:center;gap:14px">
          <div style="font-size:30px;font-weight:820">${under.team}</div>
          <span class="chip neg">${under.xpts_diff} vs xPts</span></div>
        <p class="sub" style="margin-top:10px">"Deserved" ${under.xpts} points on the model but took only ${under.pts} — the gap that often precedes a sacking or a relegation.</p></div>
    </div>`}
    <h3 style="margin:26px 0 12px;font-size:14px;color:var(--mut2);text-transform:uppercase;letter-spacing:.07em">Explore</h3>
    <div class="feat">
      ${feats.map(([k,ic,t,d])=>html`<div class="fcard" onClick=${()=>go(k)}>
        <div class="ico">${ic}</div><h4>${t}</h4><p>${d}</p></div>`)}
    </div>
  </div>`;
}

/* ---------------- League Table + profile ---------------- */
function TeamProfile({competition,season,team,onBack}){
  const [d,setD]=useState(null);const [err,setErr]=useState("");
  useEffect(()=>{ setD(null); get(`${API}/api/team?competition=${encodeURIComponent(competition)}&season=${encodeURIComponent(season)}&team=${encodeURIComponent(team)}`).then(setD).catch(e=>setErr(e.message)); },[team]);
  if(err) return html`<div class="err">${err}</div>`;
  if(!d) return html`<${Loading} label=${`Loading ${team}…`}/>`;
  const s=d.summary,h=d.splits.home,a=d.splits.away;
  return html`<div class="view">
    <div style="margin-bottom:14px"><button class="tab" onClick=${onBack}>← Back to table</button></div>

/* ---------------- Compare ---------------- */
function CompareTab(){
  const [seasons,setSeasons]=useState([]);const [sel,setSel]=useState("");
  const [tbl,setTbl]=useState(null);const [ov,setOv]=useState(null);
  const [t1,setT1]=useState("");const [t2,setT2]=useState("");const [err,setErr]=useState("");const [loading,setLoading]=useState(false);
  useEffect(()=>{ get(`${API}/api/predict/seasons`).then(s=>{setSeasons(s);if(s.length){const d=s.find(x=>x.label.startsWith('Premier')&&x.season.includes('2022'))||s[0];load(d.competition+'|'+d.season);}}).catch(e=>setErr(e.message)); },[]);
  async function load(v){ setSel(v);setTbl(null);setOv(null);setT1("");setT2(""); if(!v)return; const[c,s]=v.split("|"); setLoading(true);setErr("");
    try{ const[a,b]=await Promise.all([ get(`${API}/api/table?competition=${encodeURIComponent(c)}&season=${encodeURIComponent(s)}`), get(`${API}/api/predict/overview?competition=${encodeURIComponent(c)}&season=${encodeURIComponent(s)}`)]);
      setTbl(a);setOv(b); const srt=[...a.table]; setT1(srt[0].team); setT2(srt[1].team);
    }catch(e){setErr(e.message);}finally{setLoading(false);} }
  const rows=tbl&&tbl.table; const ratings=ov&&Object.fromEntries(ov.ratings.map(r=>[r.team,r]));
  function metrics(name){ const r=rows.find(x=>x.team===name); const rt=ratings[name]||{attack:0,defence:0};
    return {team:name, pts:r.pts, xpts:r.xpts, gf:r.gf, ga:r.ga, attack:rt.attack, defence:rt.defence,
      formpts:(r.form||[]).reduce((s,f)=>s+(f==='W'?3:f==='D'?1:0),0)}; }
  let radar=null,mA,mB;
  if(rows&&ratings&&t1&&t2&&t1!==t2){
    mA=metrics(t1);mB=metrics(t2);
    const all=rows.map(r=>({pts:r.pts,gf:r.gf,ga:r.ga,at:(ratings[r.team]||{}).attack||0,df:(ratings[r.team]||{}).defence||0}));
    const rng=(arr)=>[Math.min(...arr),Math.max(...arr)];
    const nz=(v,[lo,hi])=>hi===lo?.5:Math.max(.05,Math.min(1,(v-lo)/(hi-lo)));
    const Rpts=rng(all.map(a=>a.pts)),Rgf=rng(all.map(a=>a.gf)),Rga=rng(all.map(a=>-a.ga)),Rat=rng(all.map(a=>a.at)),Rdf=rng(all.map(a=>-a.df));
    const axes=["Attack","Defence","Points","Goals for","Goals prevented","Form"];
    const vec=m=>[nz(m.attack,Rat),nz(-m.defence,Rdf),nz(m.pts,Rpts),nz(m.gf,Rgf),nz(-m.ga,Rga),Math.max(.05,m.formpts/15)];
    radar={axes,a:vec(mA),b:vec(mB)};
  }
  return html`<div class="view">
    <div class="hero"><h1>Compare teams</h1><p>Two sides, one picture — attack and defence strength, output and form on a single radar, with a head-to-head stat line and the model's prediction for the fixture both ways.</p></div>
    <div class="card"><div class="controls">
      <div class="field"><label>Competition & season</label><select value=${sel} onChange=${e=>load(e.target.value)}>
        ${seasons.map(x=>html`<option value="${x.competition}|${x.season}">${x.label}</option>`)}</select></div>
      ${rows&&html`<div class="field"><label>Team A</label><select value=${t1} onChange=${e=>setT1(e.target.value)}>
        ${rows.map(r=>html`<option value=${r.team}>${r.team}</option>`)}</select></div>`}
      ${rows&&html`<div class="field"><label>Team B</label><select value=${t2} onChange=${e=>setT2(e.target.value)}>
        ${rows.map(r=>html`<option value=${r.team}>${r.team}</option>`)}</select></div>`}
    </div></div>
    ${err&&html`<div class="err">${err}</div>`}
    ${loading&&html`<${Skeleton} h=${360}/>`}
    ${radar&&html`<div class="two">
      <div class="card"><h3>Strength radar</h3><${Radar} ...${radar} nameA=${t1} nameB=${t2}/></div>
      <div class="card"><h3>Head to head</h3>
        <table><tbody>
          ${[["Points",mA.pts,mB.pts],["Expected points",mA.xpts,mB.xpts],["Goals for",mA.gf,mB.gf],["Goals against",mA.ga,mB.ga],
             ["Attack rating",mA.attack.toFixed(2),mB.attack.toFixed(2)],["Defence rating",mA.defence.toFixed(2),mB.defence.toFixed(2)],
             ["Form (last 5 pts)",mA.formpts,mB.formpts]].map(([k,va,vb])=>html`<tr>
            <td class="num a" style="text-align:left;font-weight:700;width:33%">${va}</td>
            <td class="mut" style="text-align:center;font-size:12px">${k}</td>
            <td class="num r" style="text-align:right;font-weight:700;width:33%">${vb}</td></tr>`)}
        </tbody></table>
        <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:13px;font-weight:700">
          <span style="color:var(--accent)">${t1}</span><span style="color:var(--red)">${t2}</span></div>
      </div>
    </div>`}
  </div>`;
}

  if(!sets) return html`<${Loading} label="Loading Expected Threat…"/>`;
  const d=sets[i];
  return html`<div class="view">
    <div class="hero"><h1>Expected Threat</h1><p>xG only rewards the shot. xT values <b>moving the ball into danger</b> — the progressive passes and carries that create chances. The surface shows each zone's threat; the table ranks the best ball progressors.</p></div>
    <div class="card">${sets.length>1&&html`<div class="controls" style="margin-bottom:14px"><div class="field"><label>League</label>
      <select value=${i} onChange=${e=>setI(+e.target.value)}>${sets.map((s,idx)=>html`<option value=${idx}>${s.title}</option>`)}</select></div></div>`}
      <img class="report-img" src="${API}/output/${d.surface}?t=${Date.now()}"/></div>
    <div class="card"><h2>Top ball progressors <span class="tag">${d.title}</span></h2>
      <p class="sub">Total xT added through completed passes & carries (positive progressions only).</p>
      <table><thead><tr><th>#</th><th>Player</th><th>Team</th><th>xT added</th></tr></thead><tbody>
        ${d.leaders.map((l,idx)=>html`<tr><td class="pos">${idx+1}</td><td class="teamcell">${l.player}</td><td class="mut">${l.team}</td><td class="num a">+${l.xt_added}</td></tr>`)}
      </tbody></table></div>
  </div>`;
}

/* ---------------- Model ---------------- */
function ModelTab(){
  const [m,setM]=useState(null);const [err,setErr]=useState("");
  useEffect(()=>{ get(`${API}/api/model`).then(setM).catch(e=>setErr(e.message)); },[]);
  if(err) return html`<div class="err">${err}</div>`;
  if(!m) return html`<${Loading} label="Loading model…"/>`;
  return html`<div class="view">
    <div class="hero"><h1>The xG model</h1><p>Gradient-boosted expected goals trained on ${m.n_shots.toLocaleString()} shots — validated by ROC-AUC and a calibration curve, because a usable xG must be probabilistically honest, not just rank-ordered.</p></div>
    <div class="card"><div class="stat-grid">
      <${Stat} value=${m.roc_auc} label="ROC-AUC" cls="accent"/>
      <${Stat} value=${m.brier} label="Brier score"/>
      <${Stat} value=${m.log_loss} label="Log loss"/>
      <${Stat} value=${m.n_shots.toLocaleString()} label="Shots trained on"/>
      <${Stat} value=${`${m.predicted_goals_test} / ${m.actual_goals_test}`} label="Pred / actual goals" cls="gold"/>
    </div><p class="hint">ROC-AUC ~0.78–0.82 is the professional range. "Predicted ≈ actual" is the calibration check.</p></div>
    <div class="two">
      <div class="card"><h3>Calibration</h3><p class="sub">Does a 0.3-xG chance really go in ~30% of the time?</p><img class="report-img" src="${API}/output/${m.calibration_png}?t=${Date.now()}"/></div>
      <div class="card"><h3>Feature importance</h3><p class="sub">What the model leans on most.</p><img class="report-img" src="${API}/output/${m.importance_png}?t=${Date.now()}"/></div>
    </div>
  </div>`;
}

/* ---------------- Shell ---------------- */
const TABS=[["overview","Overview"],["table","League table"],["compare","Compare"],["predict","Predictor"],
            ["xt","Expected Threat"],["match","Match report"],["scout","Scouting"],["model","xG model"]];
function App(){
  const [tab,setTab]=useState("overview");
  const [theme,setTheme]=useState(()=>{try{return localStorage.getItem('fa-theme')||'dark'}catch{return 'dark'}});
  useEffect(()=>{ document.documentElement.setAttribute('data-theme',theme); try{localStorage.setItem('fa-theme',theme)}catch{} },[theme]);
  const View={overview:()=>html`<${Overview} go=${setTab}/>`,table:TableTab,compare:CompareTab,predict:PredictTab,
    xt:XtTab,match:MatchTab,scout:ScoutTab,model:ModelTab}[tab];
  return html`
  <div class="topbar"><div class="topbar-in">
    <div class="brand"><span class="logo">⚽</span><span class="ac">Football Analyzer</span></div>
    <nav class="nav">${TABS.map(([k,l])=>html`<button class=${"tab"+(tab===k?" active":"")} onClick=${()=>setTab(k)}>${l}</button>`)}</nav>
    <button class="tbtn" title="Toggle theme" onClick=${()=>setTheme(theme==='dark'?'light':'dark')}>${theme==='dark'?'☀':'☾'}</button>
  </div></div>
  <main><div key=${tab}><${View}/></div></main>
  <footer>Built on StatsBomb + top-5 league data · all models trained in this repo · <a href="https://github.com/sabin901/Football-Analyzer-">source on GitHub</a></footer>`;
}
render(html`<${App}/>`, document.getElementById("root"));
</script>
</body>
</html>
