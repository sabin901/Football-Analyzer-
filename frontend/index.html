<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Soccer Analytics</title>
<style>
  :root{
    --bg:#0d1117; --panel:#12161c; --panel2:#161c24; --line:#232b35;
    --fg:#e8edf2; --muted:#8a97a6; --accent:#4ea1ff; --accent2:#ffd34e;
    --red:#ff6b6b; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased;}
  a{color:var(--accent)}
  header{padding:26px 28px 18px;border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.3px}
  header .ball{font-size:26px}
  header .tag{color:var(--muted);font-size:13px;margin-left:auto}
  .tabs{display:flex;gap:6px;padding:16px 28px 0;flex-wrap:wrap}
  .tab{padding:9px 18px;border-radius:999px;border:1px solid var(--line);
       background:var(--panel);color:var(--muted);cursor:pointer;font-size:14px;
       transition:.15s}
  .tab:hover{color:var(--fg);border-color:#303a47}
  .tab.active{background:var(--accent);color:#06101f;border-color:var(--accent);font-weight:600}
  main{padding:22px 28px 60px;max-width:1120px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        padding:20px;margin-bottom:20px}
  .card h2{margin:0 0 4px;font-size:16px}
  .card p.sub{margin:0 0 16px;color:var(--muted);font-size:13px}
  .controls{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:6px;min-width:200px;flex:1}
  .field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  select,button{font-size:14px;padding:10px 12px;border-radius:10px;
         background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
  select:focus{outline:none;border-color:var(--accent)}
  button.go{background:var(--accent);color:#06101f;border:none;font-weight:600;
            cursor:pointer;padding:11px 22px}
  button.go:disabled{opacity:.45;cursor:not-allowed}
  button.go:hover:not(:disabled){filter:brightness(1.08)}
  .report-img{width:100%;border-radius:10px;border:1px solid var(--line);margin-top:4px;
              background:var(--panel2)}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
             gap:12px;margin-bottom:18px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
        padding:14px 16px}
  .stat .v{font-size:22px;font-weight:700}
  .stat .l{font-size:12px;color:var(--muted);margin-top:3px}
  .stat .v.accent{color:var(--accent)} .stat .v.gold{color:var(--accent2)}
  .stat .v.red{color:var(--red)}
  .spinner{display:inline-block;width:18px;height:18px;border:2.5px solid #2a3340;
           border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;
           vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading{color:var(--muted);font-size:14px;padding:30px 0;text-align:center}
  .err{color:var(--red);font-size:14px;padding:12px;background:#2a1618;
       border:1px solid #512a2d;border-radius:10px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:760px){.two{grid-template-columns:1fr}}
  .muted{color:var(--muted)}
  .hint{font-size:12.5px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div id="root"></div>

<script type="importmap">
{
  "imports": {
    "preact": "/app/vendor/preact.mjs",
    "preact/hooks": "/app/vendor/hooks.mjs",
    "htm": "/app/vendor/htm.mjs"
  }
}
</script>
<script type="module">
import { h, render } from "preact";
import { useState, useEffect } from "preact/hooks";
import htm from "htm";
const html = htm.bind(h);

const API = "";  // same origin

async function get(url){
  const r = await fetch(url);
  if(!r.ok){ const t = await r.text(); throw new Error(t || r.statusText); }
  return r.json();
}

function Stat({value, label, cls}){
  return html`<div class="stat"><div class="v ${cls||''}">${value}</div>
    <div class="l">${label}</div></div>`;
}

// ---------- Match report tab ----------
function MatchTab({comps}){
  const [sel, setSel] = useState("");
  const [matches, setMatches] = useState([]);
  const [matchId, setMatchId] = useState("");
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  useEffect(()=>{
    if(!sel){ setMatches([]); return; }
    const [c,s] = sel.split("_");
    setMatches([]); setMatchId(""); setData(null);
    get(`${API}/api/matches?competition_id=${c}&season_id=${s}`)
      .then(setMatches).catch(e=>setErr(e.message));
  },[sel]);

  async function run(){
    if(!matchId) return;
    setLoading(true); setErr(""); setData(null);
    try{ setData(await get(`${API}/api/report/${matchId}`)); }
    catch(e){ setErr(e.message); }
    finally{ setLoading(false); }
  }

  const st = data && data.stats;
  const home = data && data.home, away = data && data.away;
  return html`
  <div class="card">
    <h2>Post-match report</h2>
    <p class="sub">Pick a competition, then a match. The xG model is applied live and a full dashboard is generated.</p>
    <div class="controls">
      <div class="field"><label>Competition</label>
        <select value=${sel} onChange=${e=>setSel(e.target.value)}>
          <option value="">Select…</option>
          ${comps.map(c=>html`<option value="${c.competition_id}_${c.season_id}">${c.label}</option>`)}
        </select></div>
      <div class="field"><label>Match</label>
        <select value=${matchId} onChange=${e=>setMatchId(e.target.value)} disabled=${!matches.length}>
          <option value="">${matches.length? "Select…":"—"}</option>
          ${matches.map(m=>html`<option value=${m.match_id}>${m.label}</option>`)}
        </select></div>
      <button class="go" onClick=${run} disabled=${!matchId||loading}>
        ${loading? "Generating…":"Generate report"}</button>
    </div>
    <p class="hint">First run for a match takes ~15–30s (it pulls full event data); after that it's cached and instant.</p>
  </div>

  ${err && html`<div class="err">${err}</div>`}
  ${loading && html`<div class="loading"><span class="spinner"></span>Crunching the match…</div>`}

  ${data && html`<div class="card">
    <h2>${home} ${data.score[home]} – ${data.score[away]} ${away}</h2>
    <p class="sub">Model xG: ${st[home].xg_model} – ${st[away].xg_model}</p>
    <div class="stat-grid">
      <${Stat} value=${`${st[home].xg_model} / ${st[away].xg_model}`} label="Model xG (H/A)" cls="gold"/>
      <${Stat} value=${`${st[home].shots} / ${st[away].shots}`} label="Shots"/>
      <${Stat} value=${`${st[home].possession}% / ${st[away].possession}%`} label="Possession"/>
      <${Stat} value=${`${st[home].pass_accuracy}% / ${st[away].pass_accuracy}%`} label="Pass accuracy"/>
    </div>
    <img class="report-img" src="${API}/output/${data.png}?t=${Date.now()}" alt="match report"/>
  </div>`}
  `;
}

// ---------- Scouting tab ----------
function ScoutTab({comps}){
  const [sel, setSel] = useState("");
  const [teams, setTeams] = useState([]);
  const [team, setTeam] = useState("");
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  useEffect(()=>{
    if(!sel){ setTeams([]); return; }
    const [c,s] = sel.split("_");
    setTeams([]); setTeam(""); setData(null);
    get(`${API}/api/teams?competition_id=${c}&season_id=${s}`)
      .then(setTeams).catch(e=>setErr(e.message));
  },[sel]);

  async function run(){
    if(!sel||!team) return;
    const [c,s] = sel.split("_");
    setLoading(true); setErr(""); setData(null);
    try{ setData(await get(`${API}/api/scout?competition_id=${c}&season_id=${s}&team=${encodeURIComponent(team)}`)); }
    catch(e){ setErr(e.message); }
    finally{ setLoading(false); }
  }

  return html`
  <div class="card">
    <h2>Season scouting report</h2>
    <p class="sub">Aggregate a team across a whole season — the pre-match / recruitment view.</p>
    <div class="controls">
      <div class="field"><label>Competition</label>
        <select value=${sel} onChange=${e=>setSel(e.target.value)}>
          <option value="">Select…</option>
          ${comps.map(c=>html`<option value="${c.competition_id}_${c.season_id}">${c.label}</option>`)}
        </select></div>
      <div class="field"><label>Team</label>
        <select value=${team} onChange=${e=>setTeam(e.target.value)} disabled=${!teams.length}>
          <option value="">${teams.length?"Select…":"—"}</option>
          ${teams.map(t=>html`<option value=${t}>${t}</option>`)}
        </select></div>
      <button class="go" onClick=${run} disabled=${!team||loading}>
        ${loading?"Analysing…":"Build report"}</button>
    </div>
    <p class="hint">A full season means ~30–40 matches of event data, so the first build can take a minute. Cached afterwards.</p>
  </div>

  ${err && html`<div class="err">${err}</div>`}
  ${loading && html`<div class="loading"><span class="spinner"></span>Aggregating the season…</div>`}

  ${data && html`<div class="card">
    <h2>${data.team}</h2>
    <p class="sub">Played ${data.played} · ${data.W}W ${data.D}D ${data.L}L · GF ${data.goals_for} GA ${data.goals_against}</p>
    <div class="stat-grid">
      <${Stat} value=${data.xg_for_per90} label="xG for / 90" cls="accent"/>
      <${Stat} value=${data.xg_against_per90} label="xG against / 90" cls="red"/>
      <${Stat} value=${data.xg_diff_per90} label="xG diff / 90" cls="gold"/>
      <${Stat} value=${`${data.setpiece_xg_share_pct}%`} label="Set-piece xG share"/>
      <${Stat} value=${`${data.attack_left_pct}/${data.attack_central_pct}/${data.attack_right_pct}`} label="Attack L/C/R %"/>
    </div>
    <img class="report-img" src="${API}/output/${data.png}?t=${Date.now()}" alt="scouting report"/>
  </div>`}
  `;
}

// ---------- Predictor tab ----------
function PredictTab(){
  const [seasons, setSeasons] = useState([]);
  const [sel, setSel] = useState("");
  const [overview, setOverview] = useState(null);
  const [home, setHome] = useState(""); const [away, setAway] = useState("");
  const [pred, setPred] = useState(null);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  useEffect(()=>{ get(`${API}/api/predict/seasons`).then(setSeasons).catch(e=>setErr(e.message)); },[]);

  async function loadSeason(v){
    setSel(v); setOverview(null); setPred(null); setHome(""); setAway("");
    if(!v) return;
    const [c,s] = v.split("|");
    setLoading(true); setErr("");
    try{ setOverview(await get(`${API}/api/predict/overview?competition=${encodeURIComponent(c)}&season=${encodeURIComponent(s)}`)); }
    catch(e){ setErr(e.message); }
    finally{ setLoading(false); }
  }
  async function runFixture(){
    if(!sel||!home||!away) return;
    const [c,s] = sel.split("|");
    setLoading(true); setErr(""); setPred(null);
    try{ setPred(await get(`${API}/api/predict/fixture?competition=${encodeURIComponent(c)}&season=${encodeURIComponent(s)}&home=${encodeURIComponent(home)}&away=${encodeURIComponent(away)}`)); }
    catch(e){ setErr(e.message); }
    finally{ setLoading(false); }
  }

  const m = overview && overview.metrics;
  return html`
  <div class="card">
    <h2>Match predictor</h2>
    <p class="sub">A Dixon-Coles Poisson model: fits each team's attack & defence from results, then predicts any fixture. Pick a league season to fit and validate it.</p>
    <div class="controls">
      <div class="field"><label>Competition & season</label>
        <select value=${sel} onChange=${e=>loadSeason(e.target.value)}>
          <option value="">Select…</option>
          ${seasons.map(s=>html`<option value="${s.competition}|${s.season}">${s.label} (${s.matches})</option>`)}
        </select></div>
    </div>
  </div>

  ${err && html`<div class="err">${err}</div>`}
  ${loading && html`<div class="loading"><span class="spinner"></span>Fitting the model…</div>`}

  ${m && html`<div class="card">
    <h2>Model quality — ${m.competition} ${m.season}</h2>
    <p class="sub">Time-split validation: trained on the first ${m.train_matches} matches, tested on the next ${m.test_matches}. Lower RPS / log-loss is better.</p>
    <div class="stat-grid">
      <${Stat} value=${`${(m.accuracy*100).toFixed(1)}%`} label=${`Accuracy (base ${(m.baseline_accuracy*100).toFixed(1)}%)`} cls="accent"/>
      <${Stat} value=${m.rps} label=${`RPS (base ${m.baseline_rps})`} cls=${m.rps<m.baseline_rps?"gold":""}/>
      <${Stat} value=${m.log_loss} label=${`Log loss (base ${m.baseline_log_loss})`}/>
      <${Stat} value=${m.home_advantage} label="Home advantage"/>
    </div>
    <p class="hint">An RPS near 0.19–0.21 is the professional range for 1X2 prediction. Beating the base-rate baseline on every metric means the model is genuinely learning team strength.</p>
  </div>

  <div class="card">
    <h2>Predict a fixture</h2>
    <div class="controls">
      <div class="field"><label>Home</label>
        <select value=${home} onChange=${e=>setHome(e.target.value)}>
          <option value="">Select…</option>
          ${overview.teams.map(t=>html`<option value=${t}>${t}</option>`)}
        </select></div>
      <div class="field"><label>Away</label>
        <select value=${away} onChange=${e=>setAway(e.target.value)}>
          <option value="">Select…</option>
          ${overview.teams.map(t=>html`<option value=${t}>${t}</option>`)}
        </select></div>
      <button class="go" onClick=${runFixture} disabled=${!home||!away||home===away}>Predict</button>
    </div>
    ${pred && html`<div style="margin-top:18px">
      <div class="stat-grid">
        <${Stat} value=${`${(pred.p_home*100).toFixed(0)}%`} label=${`${pred.home} win`} cls="accent"/>
        <${Stat} value=${`${(pred.p_draw*100).toFixed(0)}%`} label="Draw"/>
        <${Stat} value=${`${(pred.p_away*100).toFixed(0)}%`} label=${`${pred.away} win`} cls="red"/>
        <${Stat} value=${`${pred.expected_home_goals} – ${pred.expected_away_goals}`} label="Expected goals" cls="gold"/>
        <${Stat} value=${`${(pred.over_2_5*100).toFixed(0)}%`} label="Over 2.5 goals"/>
      </div>
      <p class="sub" style="margin-top:6px">Most likely scorelines: ${pred.most_likely.map(s=>`${s.score} (${(s.p*100).toFixed(0)}%)`).join("  ·  ")}</p>
    </div>`}
  </div>

  <div class="card">
    <h2>Fitted team strengths</h2>
    <p class="sub">Attack & defence ratings the model learned (higher attack = scores more; lower/negative defence = concedes less).</p>
    <div style="max-height:320px;overflow:auto">
      <table style="width:100%;border-collapse:collapse;font-size:14px">
        <thead><tr style="color:var(--muted);text-align:left">
          <th style="padding:6px 8px">Team</th><th style="padding:6px 8px">Attack</th><th style="padding:6px 8px">Defence</th></tr></thead>
        <tbody>
          ${overview.ratings.map(r=>html`<tr style="border-top:1px solid var(--line)">
            <td style="padding:6px 8px">${r.team}</td>
            <td style="padding:6px 8px;color:var(--accent)">${r.attack>0?'+':''}${r.attack}</td>
            <td style="padding:6px 8px;color:var(--red)">${r.defence>0?'+':''}${r.defence}</td></tr>`)}
        </tbody>
      </table>
    </div>
  </div>`}
  `;
}

// ---------- Expected Threat tab ----------
function XtTab(){
  const [d, setD] = useState(null);
  const [err, setErr] = useState("");
  useEffect(()=>{ get(`${API}/api/xt`).then(setD).catch(e=>setErr(e.message)); },[]);
  if(err) return html`<div class="err">${err}</div>`;
  if(!d) return html`<div class="loading"><span class="spinner"></span>Loading Expected Threat…</div>`;
  return html`
  <div class="card">
    <h2>Expected Threat (xT) — ${d.title}</h2>
    <p class="sub">xG rewards only the shot. xT values moving the ball into danger — the progressive passes and carries that create chances. The surface shows how much threat each pitch zone carries; the table ranks the best ball progressors.</p>
    <img class="report-img" src="${API}/output/${d.surface}?t=${Date.now()}" alt="xT surface"/>
  </div>
  <div class="card">
    <h2>Top ball progressors</h2>
    <p class="sub">Total xT added through completed passes & carries (positive progressions only).</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px">
      <thead><tr style="color:var(--muted);text-align:left">
        <th style="padding:6px 8px">#</th><th style="padding:6px 8px">Player</th>
        <th style="padding:6px 8px">Team</th><th style="padding:6px 8px">xT added</th></tr></thead>
      <tbody>
        ${d.leaders.map((l,i)=>html`<tr style="border-top:1px solid var(--line)">
          <td style="padding:6px 8px;color:var(--muted)">${i+1}</td>
          <td style="padding:6px 8px">${l.player}</td>
          <td style="padding:6px 8px;color:var(--muted)">${l.team}</td>
          <td style="padding:6px 8px;color:var(--accent)">+${l.xt_added}</td></tr>`)}
      </tbody>
    </table>
  </div>`;
}

// ---------- Model tab ----------
function ModelTab(){
  const [m, setM] = useState(null);
  const [err, setErr] = useState("");
  useEffect(()=>{ get(`${API}/api/model`).then(setM).catch(e=>setErr(e.message)); },[]);
  if(err) return html`<div class="err">${err}</div>`;
  if(!m) return html`<div class="loading"><span class="spinner"></span>Loading model…</div>`;
  return html`
  <div class="card">
    <h2>The xG model</h2>
    <p class="sub">Gradient-boosted trees trained on StatsBomb open data. Held-out validation below.</p>
    <div class="stat-grid">
      <${Stat} value=${m.roc_auc} label="ROC-AUC" cls="accent"/>
      <${Stat} value=${m.brier} label="Brier score"/>
      <${Stat} value=${m.log_loss} label="Log loss"/>
      <${Stat} value=${m.n_shots.toLocaleString()} label="Shots trained on"/>
      <${Stat} value=${`${m.predicted_goals_test} / ${m.actual_goals_test}`} label="Pred/actual goals (test)" cls="gold"/>
    </div>
    <p class="hint">A ROC-AUC around 0.77–0.82 is the professional range for xG. "Predicted ≈ actual" on held-out shots is the calibration check.</p>
  </div>
  <div class="two">
    <div class="card"><h2>Calibration</h2>
      <p class="sub">Does a 0.3 xG chance really go in ~30% of the time?</p>
      <img class="report-img" src="${API}/output/${m.calibration_png}?t=${Date.now()}"/>
    </div>
    <div class="card"><h2>Feature importance</h2>
      <p class="sub">What the model leans on most.</p>
      <img class="report-img" src="${API}/output/${m.importance_png}?t=${Date.now()}"/>
    </div>
  </div>`;
}

// ---------- App shell ----------
function App(){
  const [tab, setTab] = useState("match");
  const [comps, setComps] = useState([]);
  const [err, setErr] = useState("");
  useEffect(()=>{ get(`${API}/api/competitions`).then(setComps).catch(e=>setErr(e.message)); },[]);

  return html`
  <header>
    <span class="ball">⚽</span>
    <h1>Soccer Analytics</h1>
    <span class="tag">xG model · post-match & scouting reports · StatsBomb open data</span>
  </header>
  <div class="tabs">
    <div class=${"tab"+(tab==="match"?" active":"")} onClick=${()=>setTab("match")}>Match report</div>
    <div class=${"tab"+(tab==="scout"?" active":"")} onClick=${()=>setTab("scout")}>Scouting report</div>
    <div class=${"tab"+(tab==="predict"?" active":"")} onClick=${()=>setTab("predict")}>Predictor</div>
    <div class=${"tab"+(tab==="xt"?" active":"")} onClick=${()=>setTab("xt")}>Expected Threat</div>
    <div class=${"tab"+(tab==="model"?" active":"")} onClick=${()=>setTab("model")}>The model</div>
  </div>
  <main>
    ${err && html`<div class="err">Couldn't reach the backend: ${err}</div>`}
    ${tab==="match" && html`<${MatchTab} comps=${comps}/>`}
    ${tab==="scout" && html`<${ScoutTab} comps=${comps}/>`}
    ${tab==="predict" && html`<${PredictTab}/>`}
    ${tab==="xt" && html`<${XtTab}/>`}
    ${tab==="model" && html`<${ModelTab}/>`}
  </main>`;
}

render(html`<${App}/>`, document.getElementById("root"));
</script>
</body>
</html>
