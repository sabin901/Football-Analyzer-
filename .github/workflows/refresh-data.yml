name: Refresh live data

# The "live data, even if late" engine. On a schedule, this pulls fresh
# fixtures, results and standings from football-data.org (open internet on the
# runner — no sandbox limits), rebuilds the site, and commits the new data.
# That commit triggers deploy.yml, which republishes the public dashboard.
#
# Requires one repo secret: FOOTBALL_DATA_API_KEY (free key from
# https://www.football-data.org/client/register). Without it, the job skips the
# live pull gracefully and just rebuilds the site from existing data.

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours (tune as you like)
  workflow_dispatch:

permissions:
  contents: write              # to commit refreshed data back

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull live data (if API key is set)
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          if [ -n "$FOOTBALL_DATA_API_KEY" ]; then
            python src/live_api.py sync --days 10
          else
            echo "No FOOTBALL_DATA_API_KEY secret set — skipping live pull."
          fi

      - name: Rebuild site
        run: python src/build_site.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live site || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh live data [skip ci]"
            git push
          fi
