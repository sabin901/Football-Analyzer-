name: Validate, refresh and deploy
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: football-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: |
          pip install -r requirements-lock.txt
          pip check
          npm ci
      - name: Restore separately versioned snapshots
        if: github.event_name != 'pull_request'
        run: python scripts/snapshot_branch.py restore
      - name: Refresh permitted community results
        if: github.event_name != 'pull_request'
        id: refresh
        continue-on-error: true
        run: python src/open_results.py
      - name: Surface refresh failure
        if: steps.refresh.outcome == 'failure'
        run: echo '::warning::Result source unavailable. Last snapshots are retained with visible freshness warnings.'
      - name: Refresh optional delayed provider
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python src/current_provider.py
      - name: Rebuild models using earlier data only
        env:
          FOOTLYZER_RECORD_FORECASTS: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python src/forecast_lab.py
      - name: Package explicitly licensed data
        run: python src/build_site.py
      - name: Validate data, import safety and public contracts
        run: |
          python -m unittest discover -s tests -v
          npm test
          npm run format:check
          python -m black --check .
          for file in frontend/*.js; do node --check "$file"; done
      - name: Browser journeys
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
      - name: Version refreshed data separately from code
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/snapshot_branch.py save
      - name: Stamp data revision into final package
        if: github.event_name != 'pull_request'
        run: python src/build_site.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the artifact built in this run
        id: deployment
        uses: actions/deploy-pages@v4
